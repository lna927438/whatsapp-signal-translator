<!doctype html>
<html lang="zh-CN">
  <body style="margin:0;background:#f4f7fb;font-family:Arial,Helvetica,sans-serif;color:#10213d">
    <div style="max-width:560px;margin:36px auto;padding:30px;background:#ffffff;border:1px solid #e2e8f2;border-radius:16px">
      <div style="font-size:13px;font-weight:700;color:#1767ff">Realtime Translator</div>
      <h2 style="margin:18px 0 8px">账号安全验证</h2>
      <p style="color:#687b96;line-height:1.7">下面的验证码可用于找回账号或重置密码：</p>
      <div style="margin:24px 0;padding:18px;text-align:center;border-radius:12px;background:#eef5ff;color:#1457dd;font-size:30px;font-weight:800;letter-spacing:6px">{{ .Token }}</div>
      <p style="color:#687b96;line-height:1.7">请勿将验证码转发给任何人。如果不是您本人发起的操作，请忽略此邮件。</p>
    </div>
  </body>
</html>
