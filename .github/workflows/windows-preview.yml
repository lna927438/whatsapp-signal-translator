name: Windows local acceptance installer
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  installer:
    runs-on: windows-latest
    timeout-minutes: 90
    env:
      VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
      VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.17.0'
      - uses: pnpm/action-setup@v4
        with:
          version: '11.5.2'
      - run: pnpm install --frozen-lockfile
      - run: pnpm --dir tests install --frozen-lockfile
      - run: node scripts/release-gate.mjs --local
      - run: pnpm --dir tests test
      - run: node scripts/security-scan.mjs
      - name: Build pinned native resources
        shell: pwsh
        run: ./scripts/build-pinned-resources.ps1
      - name: Build explicitly unsigned prerelease for local acceptance
        shell: pwsh
        run: ./scripts/package-hellodog-release.ps1 -Prerelease -LocalUnsigned
      - name: Record exact installer bytes
        shell: pwsh
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $output = Join-Path 'release' ('v' + $version)
          $installer = Get-ChildItem -LiteralPath $output -File -Filter '*.exe'
          if ($installer.Count -ne 1) { throw 'Exactly one installer is required' }
          $hash = (Get-FileHash -LiteralPath $installer.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          @{version=$version;sha256=$hash;bytes=$installer.Length;source=$env:GITHUB_SHA;signed=$false;published=$false} | ConvertTo-Json | Set-Content (Join-Path $output 'LOCAL-BUILD.json')
      - uses: actions/upload-artifact@v4
        with:
          name: HelloDog-Windows-local-acceptance
          path: |
            release/v*/*.exe
            release/v*/LOCAL-BUILD.json
          compression-level: 0
          if-no-files-found: error
          retention-days: 14
