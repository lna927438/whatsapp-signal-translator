name: Security acceptance without deployment
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.17.0'
      - uses: pnpm/action-setup@v4
        with:
          version: '11.5.2'
      - run: pnpm install --frozen-lockfile
      - run: pnpm --dir tests install --frozen-lockfile
      - run: pnpm --dir website install --frozen-lockfile
      - run: node scripts/release-gate.mjs --local
      - run: node scripts/security-scan.mjs
      - run: pnpm typecheck && pnpm build
      - run: pnpm --dir website build
      - run: pnpm --dir tests typecheck && pnpm --dir tests test
