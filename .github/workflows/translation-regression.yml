name: Translation regression

on:
  pull_request:
    paths:
      - 'server/worker/**'
      - 'supabase/migrations/**'
      - 'src/main/translation/**'
      - 'src/main/types.ts'
      - 'tests/**'
      - '.github/workflows/translation-regression.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17.6
        env:
          POSTGRES_PASSWORD: local-ci-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: tests
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: tests/package-lock.json
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run typecheck
      - run: npm test
      - name: Verify native PostgreSQL concurrency
        run: npm run test:postgres
        env:
          TRANSLATOR_TEST_PG_URL: postgresql://postgres:local-ci-only@127.0.0.1:5432/postgres
