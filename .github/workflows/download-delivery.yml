name: Download delivery checks

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'website/src/views/DownloadView.vue'
      - 'scripts/check-download-delivery.py'
      - '.github/workflows/download-delivery.yml'
  push:
    branches: [main]
    paths:
      - 'website/src/views/DownloadView.vue'
      - 'scripts/check-download-delivery.py'
      - '.github/workflows/download-delivery.yml'

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Check public download caching and byte-range support
        run: python scripts/check-download-delivery.py
