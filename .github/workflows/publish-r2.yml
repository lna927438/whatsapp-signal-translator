name: Publish Windows Release to R2

on:
  workflow_dispatch:
  push:
    branches: ['release/windows-v*']

concurrency:
  group: windows-r2-release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  publish:
    runs-on: windows-latest
    timeout-minutes: 25
    env:
      VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
      VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
      R2_BUCKET: ${{ secrets.R2_BUCKET }}
      AWS_DEFAULT_REGION: auto

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: package.json

      - name: Install AWS CLI
        shell: powershell
        run: python -m pip install --disable-pip-version-check awscli

      - name: Validate R2 credentials before building
        shell: powershell
        run: |
          $required = @('R2_ACCESS_KEY_ID','R2_SECRET_ACCESS_KEY','R2_ENDPOINT','R2_BUCKET')
          foreach ($name in $required) {
            $value = (Get-Item "Env:$name").Value
            if ([string]::IsNullOrWhiteSpace($value)) {
              throw "Missing GitHub Actions secret: $name"
            }
          }

          $endpointUri = [Uri]$env:R2_ENDPOINT.Trim()
          $endpoint = "$($endpointUri.Scheme)://$($endpointUri.Host)"
          $bucket = $env:R2_BUCKET.Trim()
          $env:AWS_ACCESS_KEY_ID = $env:R2_ACCESS_KEY_ID.Trim()
          $env:AWS_SECRET_ACCESS_KEY = $env:R2_SECRET_ACCESS_KEY.Trim()
          Write-Output "::add-mask::$($env:AWS_ACCESS_KEY_ID)"
          Write-Output "::add-mask::$($env:AWS_SECRET_ACCESS_KEY)"

          if ($endpointUri.Scheme -ne 'https') { throw 'R2_ENDPOINT must use https.' }
          if ($endpointUri.Host -notmatch '\.r2\.cloudflarestorage\.com$') { throw 'R2_ENDPOINT host is not a Cloudflare R2 S3 endpoint.' }

          Write-Host "R2 endpoint host: $($endpointUri.Host)"
          Write-Host "R2 bucket: $bucket"
          if ($endpointUri.AbsolutePath -and $endpointUri.AbsolutePath -ne '/') {
            Write-Host "R2_ENDPOINT contained a path; it will be normalized to the account-level endpoint."
          }

          aws s3api list-objects-v2 --bucket $bucket --max-items 1 --endpoint-url $endpoint --region auto | Out-Null
          if ($LASTEXITCODE -ne 0) {
            throw 'R2 credential test failed. Verify Access Key ID, Secret Access Key, and that the token belongs to this Cloudflare account/bucket.'
          }

          "R2_ENDPOINT_NORMALIZED=$endpoint" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "R2_BUCKET_NORMALIZED=$bucket" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "AWS_ACCESS_KEY_ID=$($env:AWS_ACCESS_KEY_ID)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "AWS_SECRET_ACCESS_KEY=$($env:AWS_SECRET_ACCESS_KEY)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Check release version before building
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $version = [string](Get-Content package.json | ConvertFrom-Json).version
          if ($version -notmatch '^\d+\.\d+\.\d+$') { throw 'Expected a stable three-part release version.' }
          if ($env:GITHUB_EVENT_NAME -eq 'push' -and $env:GITHUB_REF_NAME -ne "release/windows-v$version") {
            throw 'Release branch must match the package version.'
          }
          $objects = aws s3api list-objects-v2 --bucket $env:R2_BUCKET_NORMALIZED --prefix 'metadata/version.json' --endpoint-url $env:R2_ENDPOINT_NORMALIZED --region auto --output json | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) { throw 'Could not inspect the current release.' }
          if ($objects.Contents | Where-Object { $_.Key -eq 'metadata/version.json' }) {
            $currentPath = Join-Path $env:RUNNER_TEMP 'previous-version.json'
            aws s3api get-object --bucket $env:R2_BUCKET_NORMALIZED --key 'metadata/version.json' --endpoint-url $env:R2_ENDPOINT_NORMALIZED --region auto $currentPath | Out-Null
            if ($LASTEXITCODE -ne 0) { throw 'Could not read the current release metadata.' }
            $current = Get-Content $currentPath -Raw | ConvertFrom-Json
            if ([string]$current.version -notmatch '^\d+\.\d+\.\d+$') { throw 'Current release metadata has an invalid version.' }
            if ([Version]$current.version -gt [Version]$version) { throw 'Refusing to downgrade the published release.' }
            if ([Version]$current.version -eq [Version]$version -and $current.sourceCommit -ne $env:GITHUB_SHA) {
              throw 'This version was already published from a different or unknown commit. Bump the package version.'
            }
            Write-Host "Current public release: $($current.version); publishing: $version"
          }

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Typecheck
        run: npm run typecheck

      - name: Build Windows installer
        run: npm run dist:win

      - name: Publish installer and metadata to R2
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $pkg = Get-Content package.json | ConvertFrom-Json
          $version = [string]$pkg.version
          $endpoint = $env:R2_ENDPOINT_NORMALIZED
          $bucket = $env:R2_BUCKET_NORMALIZED
          $installer = Get-ChildItem -Path release -Recurse -File -Filter '*.exe' |
            Where-Object { $_.Name -match 'Setup|setup' } |
            Sort-Object Length -Descending |
            Select-Object -First 1

          if (-not $installer) { throw 'Windows Setup.exe was not found under release/.' }

          function Invoke-AwsUpload {
            param(
              [string]$Source,
              [string]$Destination,
              [string]$ContentType,
              [string]$CacheControl
            )
            aws s3 cp $Source $Destination --endpoint-url $endpoint --region auto --content-type $ContentType --cache-control $CacheControl
            if ($LASTEXITCODE -ne 0) { throw "R2 upload failed: $Destination" }
          }

          $sha256 = (Get-FileHash -Algorithm SHA256 $installer.FullName).Hash.ToLowerInvariant()
          $size = $installer.Length
          $versionKey = "windows/v$version/WhatsApp-Signal-Translator-Setup-v$version.exe"
          $latestKey = 'windows/latest/WhatsApp-Signal-Translator-Setup.exe'

          $objects = aws s3api list-objects-v2 --bucket $bucket --prefix $versionKey --endpoint-url $endpoint --region auto --output json | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) { throw 'Could not inspect the immutable installer key.' }
          if ($objects.Contents | Where-Object { $_.Key -eq $versionKey }) {
            $existingPath = Join-Path $env:RUNNER_TEMP 'existing-version-installer.exe'
            aws s3api get-object --bucket $bucket --key $versionKey --endpoint-url $endpoint --region auto $existingPath | Out-Null
            if ($LASTEXITCODE -ne 0) { throw 'Could not verify the existing versioned installer.' }
            $existingHash = (Get-FileHash -Algorithm SHA256 $existingPath).Hash.ToLowerInvariant()
            if ($existingHash -ne $sha256) { throw 'Refusing to overwrite an immutable installer with different bytes.' }
          } else {
            Invoke-AwsUpload $installer.FullName "s3://$bucket/$versionKey" 'application/vnd.microsoft.portable-executable' 'public,max-age=31536000,immutable'
          }
          Invoke-AwsUpload $installer.FullName "s3://$bucket/$latestKey" 'application/vnd.microsoft.portable-executable' 'no-cache'

          $metadata = [ordered]@{
            version = $version
            platform = 'windows'
            versionKey = $versionKey
            latestKey = $latestKey
            sha256 = $sha256
            size = $size
            sourceCommit = $env:GITHUB_SHA
            releasedAt = (Get-Date).ToUniversalTime().ToString('o')
          } | ConvertTo-Json -Depth 4

          Get-ChildItem -Path release -Recurse -File |
            Where-Object { $_.Extension -in '.yml', '.blockmap' } |
            ForEach-Object {
              $key = "windows/v$version/$($_.Name)"
              $contentType = if ($_.Extension -eq '.yml') { 'text/yaml; charset=utf-8' } else { 'application/octet-stream' }
              Invoke-AwsUpload $_.FullName "s3://$bucket/$key" $contentType 'no-cache'
            }

          [System.IO.File]::WriteAllText((Join-Path $PWD 'version.json'), $metadata, [System.Text.UTF8Encoding]::new($false))
          Invoke-AwsUpload 'version.json' "s3://$bucket/metadata/version.json" 'application/json; charset=utf-8' 'no-cache'

          Write-Host "Published v$version to R2 bucket $bucket"
          Write-Host "Installer: $versionKey"
          Write-Host "Latest:    $latestKey"
          Write-Host "SHA256:    $sha256"
          Write-Host "Size:      $size"

      - name: Verify public website and installer checksums
        run: python scripts/verify-windows-release.py version.json

      - name: Upload CI artifact as fallback
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: whatsapp-signal-translator-windows-r2-published
          path: release/**/*
          if-no-files-found: warn
          retention-days: 7
