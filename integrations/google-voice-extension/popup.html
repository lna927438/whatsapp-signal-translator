<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>HelloDog · Google Voice</title><link rel="stylesheet" href="popup.css"></head>
<body><h1>HelloDog · Google Voice</h1><p>纯文字短信翻译，发送前先预览确认。</p><p class="notice">仅保护已识别的会话编辑器。配对成功不代表保护已生效，请查看网页助手的状态。未知界面仍可右键翻译选中文字。</p>
<form id="pair"><label for="code">HelloDog 连接码</label><input id="code" type="password" autocomplete="off" spellcheck="false" maxlength="128" placeholder="粘贴此窗口的连接码"><button type="submit">连接 HelloDog</button></form>
<div class="actions"><button id="refresh" type="button">检查连接</button><button id="disconnect" type="button">断开连接</button></div><p id="status" role="status" aria-live="polite">正在检查连接…</p>
<p class="hint">按 HelloDog 设置翻译已识别的可见历史。同会话同方向同文同时间记录复用翻译编号。发送结果不明时先核对，不自动重发。翻译可能消耗账号字符。</p><script type="module" src="popup.mjs"></script></body></html>
